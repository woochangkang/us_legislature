name: Coupang lobbyist roster LD203 collection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect full roster contribution records
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python3 tools/collect_coupang_roster_ld203.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lda-roster
          path: lda_roster/
