name: Coupang LDA source collection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official public LDA records
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python3 tools/collect_coupang_lda.py --out lda_coupang
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lda-coupang-${{ github.run_id }}
          path: lda_coupang/
          retention-days: 30
