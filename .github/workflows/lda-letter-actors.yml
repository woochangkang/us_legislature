name: Coupang letter actors LD203 verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official filings
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python3 tools/collect_coupang_letter_actors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lda-letter-actors
          path: lda_letter_actors/
